<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MediBridge</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-[#F8FAFC] text-slate-800">
<div id="app"></div>
<script>
/* ============================================================
   MediBridge Frontend — real API connected
   Deploy target: Vercel (endpoint base = /api)
   ============================================================ */

const API_BASE = '/api';
const TOKEN_KEY = 'mb_token';
const USER_KEY  = 'mb_user';

const getToken = () => localStorage.getItem(TOKEN_KEY);
const getUser  = () => { try { return JSON.parse(localStorage.getItem(USER_KEY) || 'null'); } catch { return null; } };
const setAuth  = (t,u) => { localStorage.setItem(TOKEN_KEY,t); localStorage.setItem(USER_KEY,JSON.stringify(u)); };
const clearAuth= () => { localStorage.removeItem(TOKEN_KEY); localStorage.removeItem(USER_KEY); };

let currentUser = getUser();

/* ---------- fetch wrapper with loading ---------- */
async function api(path, { method='GET', body, auth=true } = {}) {
  const headers = { 'Content-Type':'application/json' };
  if (auth && getToken()) headers.Authorization = 'Bearer ' + getToken();
  const res = await fetch(API_BASE + path, {
    method, headers, body: body ? JSON.stringify(body) : undefined
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
  return data;
}

/* ---------- loading spinner overlay ---------- */
function Loading(msg='Loading…'){
  return `<div class="fixed inset-0 bg-white/70 backdrop-blur-sm z-50 flex items-center justify-center">
    <div class="flex flex-col items-center gap-3">
      <div class="w-10 h-10 border-4 border-[#1a4b7a] border-t-transparent rounded-full animate-spin"></div>
      <div class="text-sm text-slate-500 font-semibold">${msg}</div>
    </div>
  </div>`;
}
function showLoading(msg){ document.body.insertAdjacentHTML('beforeend', `<div id="mb-loader">${Loading(msg)}</div>`); }
function hideLoading(){ document.getElementById('mb-loader')?.remove(); }

/* ---------- helpers ---------- */
function Logo(size="w-9 h-9"){ return `<img src="logo.png" class="${size} object-contain rounded-xl bg-white p-1">`; }
function logout(){ clearAuth(); currentUser=null; render(); }
function toast(msg, type='info'){
  const color = type==='error' ? 'bg-red-600' : type==='success' ? 'bg-green-600' : 'bg-slate-900';
  const el = document.createElement('div');
  el.className = `${color} text-white px-5 py-3 rounded-xl shadow-lg fixed bottom-6 right-6 z-[60] text-sm font-semibold`;
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2800);
}

/* ---------- router ---------- */
function render(){
  if(!currentUser) return renderLanding();
  if(currentUser.role==='PATIENT')         return renderPatient();
  if(currentUser.role==='PROFESSIONAL')    return renderProfessional();
  if(currentUser.role==='FACILITY_ADMIN')  return renderFacility();
  if(currentUser.role==='PLATFORM_ADMIN')  return renderAdmin();
}

/* ============================================================
   LANDING
   ============================================================ */
function renderLanding(){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen">
    <nav class="max-w-7xl mx-auto p-6 flex justify-between items-center">
      <div class="flex gap-3 items-center">${Logo()}<b class="text-xl tracking-tight">MediBridge</b></div>
      <button onclick="renderLogin()" class="px-5 py-2.5 bg-slate-900 text-white rounded-full font-semibold">Login</button>
    </nav>
    <div class="max-w-7xl mx-auto px-6 py-12 grid md:grid-cols-2 gap-12 items-center">
      <div>
        <h1 class="text-5xl font-black leading-[1.1]">One Patient.<br><span class="text-[#1a4b7a]">One Secure Health Record.</span><br>Anywhere.</h1>
        <p class="mt-6 text-slate-500 text-lg">Patients get a unique Health ID + QR. Authorized providers can request access, view relevant history, add encounters, and every access is audited.</p>
        <div class="grid grid-cols-2 gap-3 mt-8">
          <button onclick="renderRegister('PATIENT')" class="p-5 bg-[#1a4b7a] text-white rounded-2xl text-left"><b>Patient</b><br><span class="text-sm opacity-80">Get Health ID + QR</span></button>
          <button onclick="renderRegister('PROFESSIONAL')" class="p-5 bg-white border rounded-2xl text-left"><b>Doctor / Nurse</b><br><span class="text-sm text-slate-500">Join a facility</span></button>
          <button onclick="renderRegister('FACILITY_ADMIN')" class="p-5 bg-white border rounded-2xl text-left"><b>Facility</b><br><span class="text-sm text-slate-500">Hospital / Clinic</span></button>
          <button onclick="renderLogin(true)" class="p-5 bg-slate-900 text-white rounded-2xl text-left"><b>Demo Admin</b><br><span class="text-sm opacity-60">admin@medibridge.ng</span></button>
        </div>
      </div>
      <div class="bg-white rounded-[2rem] shadow-2xl p-3"><div class="bg-slate-900 rounded-[1.5rem] p-6 text-white">
        <div class="flex justify-between items-center">
          <div class="flex gap-2 items-center">${Logo('w-8 h-8')}<span class="text-slate-400 text-xs">HEALTH ID</span></div>
          <span class="bg-green-500 text-[10px] px-2 py-1 rounded-full">VERIFIED</span>
        </div>
        <div class="mt-3 text-3xl font-black">MB-001001</div>
        <div class="mt-2 text-slate-400 text-sm">Amina Yusuf • DOB: 1995</div>
        <div class="mt-6 bg-white p-4 rounded-xl flex justify-center"><div id="demoqr"></div></div>
        <div class="mt-6 grid grid-cols-2 gap-3 text-sm">
          <div class="bg-slate-800 p-3 rounded-xl">Records<br><b class="text-xl">3</b></div>
          <div class="bg-slate-800 p-3 rounded-xl">Access Logs<br><b class="text-xl">12</b></div>
        </div>
      </div></div>
    </div>
  </div>`;
  setTimeout(()=>{ try{ new QRCode(document.getElementById('demoqr'),{text:'MB-001001',width:120,height:120}); }catch(e){} },200);
}

/* ============================================================
   LOGIN
   ============================================================ */
function renderLogin(isDemo=false){
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-md bg-white rounded-[1.5rem] shadow-xl p-8">
      <div class="flex gap-3 items-center justify-center mb-6">${Logo('w-12 h-12')}<b class="text-2xl">MediBridge</b></div>
      <h2 class="text-2xl font-bold text-center">Welcome back</h2>
      <input id="email" value="${isDemo?'admin@medibridge.ng':''}" placeholder="Email" class="w-full mt-6 p-3.5 border rounded-xl">
      <input id="pass" type="password" value="${isDemo?'admin123':''}" placeholder="Password" class="w-full mt-3 p-3.5 border rounded-xl">
      <button id="loginBtn" onclick="doLogin()" class="w-full mt-4 bg-[#1a4b7a] text-white p-3.5 rounded-xl font-semibold">Login</button>
      <div id="err" class="text-red-500 text-sm mt-3"></div>
      <button onclick="renderLanding()" class="mt-4 text-sm text-blue-600 font-semibold w-full">← Back</button>
    </div>
  </div>`;
}

async function doLogin(){
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('pass').value;
  const btn = document.getElementById('loginBtn');
  btn.disabled = true; btn.textContent = 'Signing in…';
  try{
    const { token, user } = await api('/auth/login', { method:'POST', body:{ email, password }, auth:false });
    setAuth(token, user);
    currentUser = user;
    render();
    toast('Welcome, ' + user.fullName, 'success');
  }catch(e){
    document.getElementById('err').innerText = e.message;
    btn.disabled = false; btn.textContent = 'Login';
  }
}

/* ============================================================
   REGISTER
   ============================================================ */
async function renderRegister(role){
  let facOptions = '';
  if(role==='PROFESSIONAL'){
    showLoading('Loading facilities…');
    try{
      const facs = await api('/facilities', { auth:false });
      facOptions = facs.map(f=>`<option value="${f._id}">${f.name}</option>`).join('');
    }catch(e){}
    hideLoading();
  }
  document.getElementById('app').innerHTML=`
  <div class="min-h-screen flex items-center justify-center p-6">
    <div class="w-full max-w-lg bg-white rounded-[1.5rem] shadow-xl p-8">
      <div class="flex gap-2 items-center mb-2">${Logo('w-10 h-10')}<b>MediBridge</b></div>
      <h2 class="text-2xl font-bold">Register as ${role}</h2>
      <div class="grid gap-3 mt-6">
        <input id="fullname" placeholder="Full Name" class="p-3.5 border rounded-xl">
        <input id="email" placeholder="Email" class="p-3.5 border rounded-xl">
        <input id="pass" type="password" placeholder="Password" class="p-3.5 border rounded-xl">
        ${role==='PATIENT'?`<div class="grid grid-cols-2 gap-3"><input id="dob" type="date" class="p-3.5 border rounded-xl"><select id="gender" class="p-3.5 border rounded-xl"><option>Male</option><option>Female</option></select></div><input id="phone" placeholder="Phone" class="p-3.5 border rounded-xl">`:''}
        ${role==='PROFESSIONAL'?`<select id="professionalRole" class="p-3.5 border rounded-xl"><option>Doctor</option><option>Nurse</option><option>Pharmacist</option><option>Lab Scientist</option></select><input id="licenceNo" placeholder="Licence No" class="p-3.5 border rounded-xl"><select id="facilityId" class="p-3.5 border rounded-xl"><option value="">Select Facility</option>${facOptions}</select>`:''}
        ${role==='FACILITY_ADMIN'?`<input id="name" placeholder="Facility Name" class="p-3.5 border rounded-xl"><select id="type" class="p-3.5 border rounded-xl"><option>Hospital</option><option>Clinic</option><option>Diagnostic Centre</option></select><input id="address" placeholder="Address" class="p-3.5 border rounded-xl">`:''}
      </div>
      <button id="regBtn" onclick="doRegister('${role}')" class="w-full mt-6 bg-[#1a4b7a] text-white p-3.5 rounded-xl font-semibold">Create Account</button>
      <div id="err" class="text-red-500 text-sm mt-3"></div>
      <button onclick="renderLanding()" class="mt-4 text-sm text-blue-600 font-semibold">← Back</button>
    </div>
  </div>`;
}

async function doRegister(role){
  const v = id => document.getElementById(id)?.value;
  const body = { role, fullName:v('fullname'), email:v('email'), password:v('pass') };
  if(role==='PATIENT')       Object.assign(body,{ dob:v('dob'), gender:v('gender'), phone:v('phone') });
  if(role==='PROFESSIONAL')  Object.assign(body,{ professionalRole:v('professionalRole'), licenceNo:v('licenceNo'), facilityId:v('facilityId') });
  if(role==='FACILITY_ADMIN')Object.assign(body,{ name:v('name'), type:v('type'), address:v('address') });

  const btn = document.getElementById('regBtn');
  btn.disabled = true; btn.textContent = 'Creating…';
  try{
    const { token, user } = await api('/auth/register', { method:'POST', body, auth:false });
    setAuth(token, user);
    currentUser = user;
    render();
    toast('Account created', 'success');
  }catch(e){
    document.getElementById('err').innerText = e.message;
    btn.disabled = false; btn.textContent = 'Create Account';
  }
}

/* ============================================================
   PATIENT DASHBOARD
   ============================================================ */
async function renderPatient(){
  document.getElementById('app').innerHTML = `<div class="max-w-6xl mx-auto p-4">${Loading('Loading your health record…')}</div>`;
  try{
    const { patient, records, requests, logs } = await api('/patient/me');
    document.getElementById('app').innerHTML = `
    <div class="max-w-6xl mx-auto p-4">
      <div class="flex justify-between items-center bg-white p-4 rounded-2xl shadow-sm">
        <div class="flex gap-3 items-center">${Logo()}<div><b>${patient.fullName}</b><div class="text-xs text-slate-500">${patient.healthId}</div></div></div>
        <button onclick="logout()" class="px-4 py-2 bg-slate-900 text-white rounded-full text-sm">Logout</button>
      </div>
      <div class="grid md:grid-cols-3 gap-4 mt-4">
        <div class="bg-white p-6 rounded-2xl shadow-sm">
          <div class="text-xs text-slate-400">MY HEALTH ID</div>
          <div class="text-3xl font-black mt-2 text-[#1a4b7a]">${patient.healthId}</div>
          <div class="mt-4 bg-slate-50 p-4 rounded-xl flex justify-center"><div id="qrcode"></div></div>
        </div>
        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
          <div class="flex justify-between">
            <h3 class="font-bold">Access Requests</h3>
            <span class="text-xs bg-yellow-100 px-2 py-1 rounded-full">${requests.filter(r=>r.status==='PENDING').length} Pending</span>
          </div>
          <div class="mt-4 space-y-2 max-h-[260px] overflow-auto">
            ${requests.map(r=>`<div class="flex justify-between p-3 border rounded-xl">
              <div><b class="text-sm">${r.professionalName}</b>
                <div class="text-xs text-slate-500">${r.facilityName} • ${r.status}</div></div>
              ${r.status==='PENDING'
                ? `<div class="flex gap-2">
                    <button onclick="decideReq('${r._id}','APPROVED')" class="px-3 py-1.5 bg-green-600 text-white rounded-full text-xs">Approve</button>
                    <button onclick="decideReq('${r._id}','DENIED')" class="px-3 py-1.5 bg-red-600 text-white rounded-full text-xs">Deny</button>
                  </div>`
                : `<span class="text-xs">${r.status}</span>`}
            </div>`).join('') || '<div class="text-sm text-slate-400">No requests</div>'}
          </div>
        </div>
      </div>
      <div class="grid md:grid-cols-3 gap-4 mt-4">
        <div class="md:col-span-2 bg-white p-6 rounded-2xl shadow-sm">
          <h3 class="font-bold">My Records (${records.length})</h3>
          <div class="mt-4 space-y-3">
            ${records.map(r=>`<div class="p-4 bg-[#F8FAFC] rounded-xl border">
              <div class="flex justify-between">
                <b class="text-sm">${r.reason}</b>
                <span class="text-[10px] bg-slate-900 text-white px-2 py-1 rounded-full">${r.facilityName||''}</span>
              </div>
              <div class="text-xs mt-2">Dx: ${r.diagnosis||''}<br>Tx: ${r.treatment||''}</div>
            </div>`).join('') || '<div class="text-sm text-slate-400">No records yet</div>'}
          </div>
        </div>
        <div class="bg-white p-6 rounded-2xl shadow-sm">
          <h3 class="font-bold">Access History</h3>
          <div class="mt-4 space-y-2 text-xs">
            ${logs.map(l=>`<div class="p-2 border-b"><b>${l.action}</b> by ${l.actor||'System'}<br><span class="text-slate-500">${new Date(l.createdAt).toLocaleString()}</span></div>`).join('') || '<div class="text-slate-400">No logs</div>'}
          </div>
        </div>
      </div>
    </div>`;
    setTimeout(()=>{ try{ new QRCode(document.getElementById('qrcode'),{text:patient.healthId,width:140,height:140}); }catch(e){} },100);
  }catch(e){
    toast(e.message, 'error');
    if(/token|auth/i.test(e.message)) logout();
  }
}

async function decideReq(id, status){
  showLoading(status==='APPROVED'?'Approving…':'Denying…');
  try{
    await api('/requests/'+id, { method:'PATCH', body:{ status } });
    toast('Request ' + status.toLowerCase(), 'success');
    await renderPatient();
  }catch(e){ toast(e.message,'error'); }
  finally{ hideLoading(); }
}

/* ============================================================
   PROFESSIONAL DASHBOARD
   ============================================================ */
async function renderProfessional(){
  document.getElementById('app').innerHTML=`
  <div class="max-w-6xl mx-auto p-4">
    <div class="flex justify-between items-center bg-white p-4 rounded-2xl">
      <div class="flex gap-2 items-center">${Logo()}
        <div><b>${currentUser.fullName}</b><div class="text-xs text-slate-500">${currentUser.email}</div></div>
      </div>
      <button onclick="logout()" class="px-4 py-2 bg-slate-900 text-white rounded-full text-sm">Logout</button>
    </div>
    <div class="grid md:grid-cols-3 gap-4 mt-4">
      <div class="md:col-span-2 bg-white p-6 rounded-2xl">
        <h3 class="font-bold">Identify Patient</h3>
        <div class="flex gap-2 mt-3">
          <input id="searchId" placeholder="MB- ID" class="flex-1 p-3.5 border rounded-xl uppercase">
          <button id="searchBtn" onclick="searchPatient()" class="px-6 bg-[#1a4b7a] text-white rounded-xl">Search</button>
        </div>
        <button onclick="startScanner()" class="w-full mt-3 p-3 border-2 border-dashed rounded-xl text-sm">📷 Scan QR</button>
        <div id="reader" class="mt-3"></div>
        <div id="patientResult" class="mt-4"></div>
      </div>
    </div>
  </div>`;
}

function searchPatient(){
  const hid = document.getElementById('searchId').value.trim().toUpperCase();
  if(!hid) return toast('Enter a Health ID','error');
  doSearch(hid);
}

async function doSearch(healthId){
  const el = document.getElementById('patientResult');
  el.innerHTML = `<div class="p-6 flex justify-center">${Loading('Looking up patient…').replace('fixed inset-0','').replace('z-50','')}</div>`;
  const btn = document.getElementById('searchBtn');
  if(btn){ btn.disabled = true; btn.textContent = '…'; }
  try{
    const data = await api('/professionals/me/patients/' + encodeURIComponent(healthId));
    if(data.status === 'PENDING'){
      el.innerHTML = `<div class="p-4 bg-yellow-50 border rounded-xl">Request sent to <b>${data.patient.fullName}</b> — waiting approval</div>`;
      return;
    }
    const { patient, records } = data;
    el.innerHTML = `
    <div class="p-4 bg-green-50 border rounded-xl">
      <b>${patient.fullName} — ${patient.healthId}</b>
      <div class="mt-3 space-y-2">
        ${records.map(r=>`<div class="p-2 bg-white rounded text-xs"><b>${r.reason}</b> — ${r.diagnosis}</div>`).join('') || '<div class="text-xs text-slate-400">No records</div>'}
      </div>
      <div class="mt-4 p-3 bg-white rounded-xl">
        <h5 class="font-bold text-sm">Add Encounter</h5>
        <input id="reason" placeholder="Reason" class="w-full mt-2 p-2 border rounded">
        <input id="diag" placeholder="Diagnosis" class="w-full mt-2 p-2 border rounded">
        <textarea id="treat" placeholder="Treatment" class="w-full mt-2 p-2 border rounded"></textarea>
        <button onclick="addRecord('${patient._id}','${patient.healthId}')" class="w-full mt-2 bg-[#1a4b7a] text-white p-2 rounded">Save</button>
      </div>
    </div>`;
  }catch(e){
    el.innerHTML = `<div class="p-4 bg-red-50 rounded-xl">${e.message}</div>`;
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = 'Search'; }
  }
}

async function addRecord(patientId, healthId){
  const reason = document.getElementById('reason').value;
  const diagnosis = document.getElementById('diag').value;
  const treatment = document.getElementById('treat').value;
  if(!reason || !diagnosis) return toast('Fill reason and diagnosis','error');
  showLoading('Saving encounter…');
  try{
    await api('/records', { method:'POST', body:{ patientId, reason, diagnosis, treatment } });
    toast('Encounter saved','success');
    await doSearch(healthId);
  }catch(e){ toast(e.message,'error'); }
  finally{ hideLoading(); }
}

function startScanner(){
  const el = document.getElementById('reader');
  el.innerHTML = 'Starting camera…';
  const qr = new Html5Qrcode("reader");
  qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    (decoded) => {
      document.getElementById('searchId').value = decoded;
      qr.stop().then(()=>{ el.innerHTML=''; doSearch(decoded.toUpperCase()); });
    },
    ()=>{}
  ).catch(()=>{ el.innerHTML = '<div class="text-red-500 text-sm">Camera unavailable</div>'; });
}

/* ============================================================
   FACILITY DASHBOARD
   ============================================================ */
async function renderFacility(){
  document.getElementById('app').innerHTML = `<div class="max-w-6xl mx-auto p-6">${Loading('Loading facility…')}</div>`;
  try{
    const { facility, staff } = await api('/facility/me/staff');
    document.getElementById('app').innerHTML=`
    <div class="max-w-6xl mx-auto p-6">
      <div class="flex justify-between bg-white p-4 rounded-2xl">
        <div class="flex gap-2 items-center">${Logo()}<b>${facility.name}</b></div>
        <button onclick="logout()" class="px-4 py-2 bg-black text-white rounded-full text-sm">Logout</button>
      </div>
      <div class="bg-white p-6 rounded-2xl mt-4">
        <div class="text-sm text-slate-500">Staff (${staff.length})</div>
        <div class="mt-3 grid md:grid-cols-2 gap-2">
          ${staff.map(p=>`<div class="p-3 border rounded-xl text-sm">
            <b>${p.fullName}</b><div class="text-xs text-slate-500">${p.professionalRole} • ${p.licenceNo||''}</div>
          </div>`).join('') || '<div class="text-sm text-slate-400">No staff yet</div>'}
        </div>
      </div>
    </div>`;
  }catch(e){
    toast(e.message,'error');
    document.getElementById('app').innerHTML = `<div class="p-6 text-red-500">${e.message}
      <button onclick="logout()" class="ml-3 px-3 py-1 bg-slate-900 text-white rounded">Logout</button></div>`;
  }
}

/* ============================================================
   ADMIN DASHBOARD
   ============================================================ */
async function renderAdmin(){
  document.getElementById('app').innerHTML = `<div class="max-w-7xl mx-auto p-6">${Loading('Loading stats…')}</div>`;
  try{
    const stats = await api('/admin/stats');
    document.getElementById('app').innerHTML=`
    <div class="max-w-7xl mx-auto p-6">
      <div class="flex justify-between bg-white p-4 rounded-2xl">
        <div class="flex gap-2 items-center">${Logo()}<b>Admin</b></div>
        <button onclick="logout()" class="px-4 py-2 bg-black text-white rounded-full text-sm">Logout</button>
      </div>
      <div class="grid grid-cols-4 gap-4 mt-4">
        <div class="bg-white p-5 rounded-2xl">Patients<br><b class="text-xl">${stats.patients}</b></div>
        <div class="bg-white p-5 rounded-2xl">Pros<br><b class="text-xl">${stats.professionals}</b></div>
        <div class="bg-white p-5 rounded-2xl">Facilities<br><b class="text-xl">${stats.facilities}</b></div>
        <div class="bg-white p-5 rounded-2xl">Records<br><b class="text-xl">${stats.records}</b></div>
      </div>
    </div>`;
  }catch(e){
    toast(e.message,'error');
    document.getElementById('app').innerHTML = `<div class="p-6 text-red-500">${e.message}
      <button onclick="logout()" class="ml-3 px-3 py-1 bg-slate-900 text-white rounded">Logout</button></div>`;
  }
}

/* ---------- boot ---------- */
render();
</script>
</body>
</html>
