<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patient Record — MediBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .brand { color: #1a4b7a; }
    .bg-brand { background-color: #1a4b7a; }
    .shimmer { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .timeline::before { content:''; position:absolute; left:8px; top:0; bottom:0; width:2px; background:#e2e8f0; }
    .timeline-dot { position:absolute; left:0; top:6px; width:18px; height:18px; border-radius:50%; background:#1a4b7a; border:3px solid #fff; box-shadow:0 0 0 2px #e2e8f0; }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen">

  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-5xl mx-auto px-5 py-3 flex justify-between items-center">
      <a href="/pages/search-patient.html" class="flex items-center gap-2 text-sm text-slate-500 hover:text-slate-900">
        <i class="fa-solid fa-arrow-left"></i> Search
      </a>
      <b class="text-sm">Patient Record</b>
      <div class="w-6"></div>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-5 py-8">
    <div id="header"></div>
    <div id="records" class="mt-6"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (!requireHospital()) throw new Error('redirect');

    const params = new URLSearchParams(window.location.search);
    const patientId = params.get('id');
    if (!patientId) {
      document.getElementById('header').innerHTML = '<div class="alert alert-danger">Missing patient id</div>';
      throw new Error('no id');
    }

    function skeletonHeader() {
      return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="h-6 w-1/3 shimmer rounded mb-3"></div>
        <div class="h-4 w-1/4 shimmer rounded"></div>
      </div>`;
    }
    function skeletonRecords() {
      return `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
        <div class="h-5 w-1/4 shimmer rounded mb-5"></div>
        ${'<div class="h-16 shimmer rounded-xl mb-3"></div>'.repeat(3)}
      </div>`;
    }

    document.getElementById('header').innerHTML = skeletonHeader();
    document.getElementById('records').innerHTML = skeletonRecords();

    async function load() {
      try {
        const [patient, records] = await Promise.all([
          api.getPatient(patientId),
          api.patientHistory(patientId),
        ]);
        renderHeader(patient);
        renderRecords(records);
      } catch (err) {
        document.getElementById('header').innerHTML = `<div class="alert alert-danger">${escapeHtml(err.message)}</div>`;
        document.getElementById('records').innerHTML = '';
      }
    }

    function renderHeader(p) {
      document.getElementById('header').innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-4">
            <div>
              <div class="text-xs text-slate-400 uppercase tracking-widest">Patient</div>
              <div class="text-2xl font-black mt-1">${escapeHtml(p.fullName)}</div>
              <div class="font-mono text-sm text-[#1a4b7a] mt-1">${escapeHtml(p.healthId)}</div>
            </div>
            <div class="text-sm text-slate-500 sm:text-right">
              <div>Registered: ${formatDate(p.createdAt)}</div>
              <div>By: ${escapeHtml(p.registeredBy?.name || '—')}</div>
            </div>
          </div>
          <div class="grid sm:grid-cols-3 gap-4 mt-6 pt-6 border-t border-slate-100 text-sm">
            <div><div class="text-xs text-slate-400 uppercase">DOB</div><div class="mt-1">${formatDateOnly(p.dob) || '—'}</div></div>
            <div><div class="text-xs text-slate-400 uppercase">Gender</div><div class="mt-1 capitalize">${escapeHtml(p.gender)}</div></div>
            <div><div class="text-xs text-slate-400 uppercase">Phone</div><div class="mt-1">${escapeHtml(p.phone || '—')}</div></div>
          </div>
        </div>`;
    }

    function renderRecords(list) {
      const addForm = `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6 mt-6">
          <h3 class="font-bold text-lg"><i class="fa-solid fa-plus text-[#1a4b7a] mr-2"></i>Add Encounter</h3>
          <form id="addForm" class="mt-5 grid sm:grid-cols-2 gap-4">
            <div><label class="text-sm font-semibold">Date</label>
              <input name="date" type="date" class="mt-1 w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"></div>
            <div><label class="text-sm font-semibold">Reason</label>
              <input name="reason" required class="mt-1 w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"></div>
            <div><label class="text-sm font-semibold">Diagnosis</label>
              <input name="diagnosis" required class="mt-1 w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"></div>
            <div><label class="text-sm font-semibold">Treatment</label>
              <input name="treatment" required class="mt-1 w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"></div>
            <div class="sm:col-span-2"><label class="text-sm font-semibold">Notes</label>
              <textarea name="notes" rows="3" class="mt-1 w-full p-3 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200"></textarea></div>
            <div class="sm:col-span-2"><button type="submit" id="addBtn"
              class="w-full bg-brand text-white p-3.5 rounded-xl font-semibold hover:opacity-90 disabled:opacity-60">
              <i class="fa-solid fa-floppy-disk mr-2"></i>Save Encounter
            </button></div>
          </form>
        </div>`;

      const timeline = list.length
        ? list.map(r => `
            <div class="relative pl-9 pb-6 timeline">
              <div class="timeline-dot"></div>
              <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
                <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                  <div class="font-bold">${escapeHtml(r.reason)}</div>
                  <div class="text-xs text-slate-400">${formatDate(r.date)}</div>
                </div>
                <div class="mt-3 grid sm:grid-cols-2 gap-3 text-sm">
                  <div><div class="text-xs text-slate-400 uppercase">Diagnosis</div><div class="mt-1">${escapeHtml(r.diagnosis)}</div></div>
                  <div><div class="text-xs text-slate-400 uppercase">Treatment</div><div class="mt-1">${escapeHtml(r.treatment)}</div></div>
                </div>
                ${r.notes ? `<div class="mt-3 text-sm"><div class="text-xs text-slate-400 uppercase">Notes</div><div class="mt-1 text-slate-600">${escapeHtml(r.notes)}</div></div>` : ''}
                <div class="mt-3 pt-3 border-t border-slate-100 text-xs text-slate-400">
                  <i class="fa-solid fa-hospital mr-1"></i>${escapeHtml(r.hospital?.name || '—')}
                </div>
              </div>
            </div>`).join('')
        : `<div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center text-slate-500">
             <i class="fa-regular fa-folder-open text-3xl text-slate-300"></i>
             <div class="mt-3">No encounters recorded yet.</div>
           </div>`;

      document.getElementById('records').innerHTML = `
        <div class="flex items-center justify-between mb-4">
          <h2 class="text-lg font-black">Encounter History <span class="text-slate-400 font-normal">(${list.length})</span></h2>
        </div>
        ${timeline}
        ${addForm}`;

      document.getElementById('addForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('addBtn');
        const fd = Object.fromEntries(new FormData(e.target).entries());
        fd.patient = patientId;
        Object.keys(fd).forEach(k => { if (fd[k] === '') delete fd[k]; });
        setLoading(btn, true);
        try {
          await api.addRecord(fd);
          toast('Encounter saved', 'success');
          document.getElementById('records').innerHTML = skeletonRecords();
          const fresh = await api.patientHistory(patientId);
          renderRecords(fresh);
        } catch (err) {
          toast(err.message, 'danger');
          setLoading(btn, false, '<i class="fa-solid fa-floppy-disk mr-2"></i>Save Encounter');
        }
      });
    }

    load();
  </script>
</body>
</html>
