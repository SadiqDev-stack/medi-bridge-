<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search Patient — MediBridge</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .brand { color: #1a4b7a; }
    .bg-brand { background-color: #1a4b7a; }
    .shimmer { background: linear-gradient(90deg,#f1f5f9 25%,#e2e8f0 50%,#f1f5f9 75%); background-size: 200% 100%; animation: sh 1.4s infinite; }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body class="bg-[#F8FAFC] text-slate-800 min-h-screen">

  <nav class="bg-white border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-5 py-3 flex justify-between items-center">
      <a href="/pages/dashboard.html" class="flex items-center gap-2 text-sm text-slate-500 hover:text-slate-900">
        <i class="fa-solid fa-arrow-left"></i> Dashboard
      </a>
      <b class="text-sm">Search Patient</b>
      <div class="w-6"></div>
    </div>
  </nav>

  <main class="max-w-4xl mx-auto px-5 py-8">
    <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
      <h1 class="text-xl font-black">Find a patient by Health ID</h1>
      <p class="text-slate-500 text-sm mt-1">Format: <code class="bg-slate-100 px-1.5 py-0.5 rounded text-xs">MB-YYYY-XXXXXX</code></p>

      <form id="searchForm" class="mt-5 flex flex-col sm:flex-row gap-3">
        <div class="relative flex-1">
          <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input name="healthId" id="healthId"
            placeholder="MB-2025-000001"
            class="w-full pl-11 p-3.5 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-200 focus:border-blue-400 font-mono uppercase">
        </div>
        <button type="submit" id="searchBtn"
          class="bg-brand text-white px-6 py-3.5 rounded-xl font-semibold hover:opacity-90 disabled:opacity-60">
          <i class="fa-solid fa-magnifying-glass mr-2"></i>Search
        </button>
      </form>
    </div>

    <div id="result" class="mt-6"></div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/ui.js"></script>
  <script>
    if (!requireHospital()) throw new Error('redirect');

    const form = document.getElementById('searchForm');
    const btn = document.getElementById('searchBtn');
    const result = document.getElementById('result');

    function skeleton() {
      result.innerHTML = `
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
          <div class="h-5 w-1/3 shimmer rounded mb-4"></div>
          <div class="grid sm:grid-cols-2 gap-4">
            <div class="h-4 shimmer rounded"></div>
            <div class="h-4 shimmer rounded"></div>
            <div class="h-4 shimmer rounded"></div>
            <div class="h-4 shimmer rounded"></div>
          </div>
        </div>`;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const healthId = document.getElementById('healthId').value.trim().toUpperCase();
      if (!healthId) return;
      setLoading(btn, true);
      skeleton();
      try {
        const p = await api.searchPatient(healthId);
        result.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
              <div>
                <div class="text-xs text-slate-400 uppercase tracking-widest">Patient found</div>
                <div class="text-xl font-black mt-1">${escapeHtml(p.fullName)}</div>
                <div class="font-mono text-sm text-[#1a4b7a] mt-1">${escapeHtml(p.healthId)}</div>
              </div>
              <a href="/pages/patient-record.html?id=${p._id}" class="bg-brand text-white px-5 py-3 rounded-xl font-semibold text-sm hover:opacity-90 text-center">
                <i class="fa-solid fa-folder-open mr-2"></i>Open Full Record
              </a>
            </div>
            <div class="grid sm:grid-cols-2 gap-4 mt-6 pt-6 border-t border-slate-100 text-sm">
              <div><div class="text-xs text-slate-400 uppercase">Date of Birth</div><div class="mt-1">${formatDateOnly(p.dob) || '—'}</div></div>
              <div><div class="text-xs text-slate-400 uppercase">Gender</div><div class="mt-1 capitalize">${escapeHtml(p.gender)}</div></div>
              <div><div class="text-xs text-slate-400 uppercase">Phone</div><div class="mt-1">${escapeHtml(p.phone || '—')}</div></div>
              <div><div class="text-xs text-slate-400 uppercase">Registered by</div><div class="mt-1">${escapeHtml(p.registeredBy?.name || '—')}</div></div>
            </div>
          </div>`;
      } catch (err) {
        result.innerHTML = `
          <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-8 text-center">
            <i class="fa-solid fa-user-slash text-3xl text-slate-300"></i>
            <div class="mt-3 font-semibold">${escapeHtml(err.message)}</div>
            <div class="text-sm text-slate-500 mt-1">Check the Health ID and try again.</div>
          </div>`;
      } finally {
        setLoading(btn, false, '<i class="fa-solid fa-magnifying-glass mr-2"></i>Search');
      }
    });
  </script>
</body>
</html>
